name: reliability gate

# Blocks a pull request whose prompt change regresses agent reliability.
#
# On every PR this replays the committed fixtures — no API key, no cost, deterministic.
# That catches changes to the prompts, scenarios, rubrics, or scoring logic, which is
# what a PR usually touches. It does NOT re-query the live model: a model can drift
# under a prompt that never changed, so the nightly job below re-records against the
# real API and gates on that. Add a GEMINI_API_KEY repository secret to enable it.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 03:00 UTC daily — catches model drift under an unchanged prompt.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  replay-gate:
    name: gate (replay from fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run eval
      - run: npm run gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorecard
          path: scorecard.html

  live-gate:
    name: gate (re-recorded against the live model)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Query the live model
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # `live` mode bypasses the fixtures entirely and writes nothing back, which is
        # exactly what drift detection needs: fresh replies to an unchanged prompt.
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "No GEMINI_API_KEY secret set — skipping the live run."
            exit 0
          fi
          node src/evaluate.js --prompt=agent-v2 --mode=live
      - run: npm run gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorecard-live
          path: scorecard.html
